name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  build:
    needs: parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render
      - name: Verify the render produced the site
        run: |
          for f in index about models/m3 models/mpt models/imm models/mixture2p models/mixture3p models/sdm models/sdt_yn models/sdt_mafc models/sdt_rating models/ezdm models/cswald models/ddm; do
            test -f "_site/$f.html" || { echo "::error::_site/$f.html missing after render"; exit 1; }
          done
          test -f _site/js/models/circular.js || { echo "::error::js/ not copied into _site"; exit 1; }
      # axe-core is a test-time tool: it is fetched here, checked against the pins in tests/a11y/axe.json and injected into
      # headless Chrome; it is never part of the site. Serious and critical violations fail the job; the rest are listed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch axe-core (pinned, checksum-verified)
        run: node tests/a11y/fetch-axe.mjs
      - name: Accessibility check (axe-core on every page state)
        run: node tests/a11y/run-axe.mjs --out axe-report.json
      - name: Keep the axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: axe-report.json
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
