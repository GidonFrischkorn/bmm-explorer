# Regenerates the parity fixtures from bmm and compares them with the committed ones, so a density
# that changes in bmm shows up here. The CRAN job blocks; the develop job reports only.
name: Oracle

on:
  push:
    branches: [main]
    paths: ["R/**", "tests/parity/**", "js/models/**"]
  pull_request:
    paths: ["R/**", "tests/parity/**", "js/models/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cran
            packages: any::bmm
            blocking: true
          - name: develop
            packages: |
              popov-lab/bmm@develop
              stan-dev/cmdstanr
            blocking: false
    name: fixtures from bmm (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.blocking }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            ${{ matrix.packages }}
            any::jsonlite
      - name: Regenerate fixtures
        run: Rscript R/make_fixtures.R "$RUNNER_TEMP/fixtures"
      - name: Compare with the committed fixtures
        run: node tests/parity/compare-fixtures.mjs tests/parity/fixtures "$RUNNER_TEMP/fixtures" 1e-10
      - name: Parity tests against the fresh fixtures
        env:
          BMM_FIXTURES: ${{ runner.temp }}/fixtures
        run: node --test
