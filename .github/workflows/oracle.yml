# Regenerates the parity fixtures from bmm and compares them with the committed ones, so a density
# that changes in bmm shows up here. The CRAN job blocks; the develop job reports only.
name: Oracle

on:
  push:
    branches: [main]
    paths: ["R/**", "tests/parity/**", "js/models/**"]
  pull_request:
    paths: ["R/**", "tests/parity/**", "js/models/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cran
            packages: any::bmm
            blocking: true
          - name: develop
            packages: |
              popov-lab/bmm@develop
              stan-dev/cmdstanr
            blocking: false
    name: fixtures from bmm (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.blocking }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            ${{ matrix.packages }}
            any::jsonlite
      - name: Regenerate fixtures
        run: Rscript R/make_fixtures.R "$RUNNER_TEMP/fixtures"
      - name: Compare with the committed fixtures
        run: node tests/parity/compare-fixtures.mjs tests/parity/fixtures "$RUNNER_TEMP/fixtures" 1e-10
      - name: Parity tests against the fresh fixtures
        env:
          BMM_FIXTURES: ${{ runner.temp }}/fixtures
        run: node --test
      # R/make_fixtures.R writes every warning it saw to warnings.txt. bmm gives a deprecation no condition class, so
      # its text is matched: "is deprecated since bmm 1.5.0 and will be removed in bmm 1.6.0" (warn_deprecated()),
      # "is deprecated as of bmm 1.4.0", "is deprecated. Please use", "From bmm 1.6.0 on this is an error". On develop
      # such a warning fails this step (the job still does not block), so a form bmm will remove is reported in the
      # weekly run before the release that removes it; the cran job annotates the warnings only.
      - name: Warnings from bmm
        if: always()
        env:
          JOB: ${{ matrix.name }}
        run: |
          f="$RUNNER_TEMP/fixtures/warnings.txt"
          if [ ! -f "$f" ]; then echo "::warning::make_fixtures.R wrote no warnings.txt"; exit 0; fi
          pattern='deprecat|will be removed|this is an error'
          dep=$(grep -iE "$pattern" "$f" | sort | uniq -c | sed "s/^ *//" || true)
          {
            echo "### Warnings from bmm ($JOB): $(wc -l < "$f" | tr -d ' ') raised, $(grep -ciE "$pattern" "$f" || true) of them deprecations"
            if [ -n "$dep" ]; then echo; echo '```'; echo "$dep"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          sort "$f" | uniq -c | sed "s/^ *//" | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            echo "::warning title=bmm warning ($JOB)::$line"
          done
          if [ "$JOB" = develop ] && [ -n "$dep" ]; then
            echo "bmm develop deprecates a form the fixture script uses:"; echo "$dep"; exit 1
          fi
