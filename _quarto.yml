project:
  type: website
  output-dir: _site
  resources:
    - js/
    - css/
    - tests/parity/fixtures/
  render:
    - "*.qmd"
    - "models/*.qmd"

website:
  title: "bmm model explorer"
  description: "See what each parameter of a bmm measurement model does, in the browser, without installing anything."
  site-url: https://www.gfrischkorn.org/bmm-explorer/
  repo-url: https://github.com/GidonFrischkorn/bmm-explorer
  repo-actions: [issue]
  favicon: images/favicon.png
  # The navbar repeats the bmm site's tabs, so the explorer reads as one section of it.
  navbar:
    pinned: true
    title: bmm
    href: https://venpopov.com/bmm/
    left:
      - text: Get started
        href: https://venpopov.com/bmm/articles/bmm.html
      - text: Functions
        href: https://venpopov.com/bmm/reference/index.html
      - text: Articles
        href: https://venpopov.com/bmm/articles/index.html
      - text: Changelog
        href: https://venpopov.com/bmm/news/index.html
      - text: Develop
        href: https://venpopov.com/bmm/dev-notes/index.html
      - text: Parameter recovery
        href: https://venpopov.com/bmm/parameter-recovery/index.html
      - text: Model explorer
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/popov-lab/bmm/
        aria-label: GitHub
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: All models
      - href: about.qmd
        text: How to read a page
      - section: "Categorical decision tasks"
        contents:
          - models/m3.qmd
          - models/mpt.qmd
      - section: "Continuous reproduction tasks"
        contents:
          - models/imm.qmd
          - models/mixture2p.qmd
          - models/mixture3p.qmd
          - models/sdm.qmd
      - section: "Signal detection"
        contents:
          - models/sdt_yn.qmd
          - models/sdt_mafc.qmd
          - models/sdt_rating.qmd
      - section: "Response times"
        contents:
          - models/ezdm.qmd
          - models/cswald.qmd
          - models/ddm.qmd
  page-footer:
    left: "bmm model explorer · [source](https://github.com/GidonFrischkorn/bmm-explorer) · code GPL-2, text CC BY 4.0"
    right: "Built with Quarto. No R, no server: everything runs in your browser."

format:
  html:
    theme: [default, css/bmm-theme.scss]
    toc: true
    css: css/explorer.css
    code-copy: true
    include-in-header:
      text: '<meta name="color-scheme" content="light">'

execute:
  enabled: false

lang: en
